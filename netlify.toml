[build]
  base = "frontend"
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"

# SPA fallback: react-router owns client-side routes like /run, so any
# path Netlify doesn't recognize as a static file should still serve
# index.html rather than 404.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
